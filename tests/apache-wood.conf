# بيئة اختبار محلية تشبه الاستضافة: Apache مع mod_php و.htaccess
# الموقع يُنسخ إلى /srv/wood (أو يُفك من ملف ZIP) قبل الاختبار.
Listen 8080

<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot /srv/wood
    <Directory /srv/wood>
        AllowOverride All
        Require all granted
    </Directory>
    # بدون تخزين مؤقت للمخرجات، حتى تظهر أي مشكلة في معالجة الأخطاء كما قد تظهر على الاستضافة
    php_admin_value output_buffering 0
    ErrorLog /var/log/apache2/wood-error.log
    CustomLog /var/log/apache2/wood-access.log combined
</VirtualHost>
